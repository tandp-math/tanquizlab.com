    <script>
        const rawQuestions = [
            {
                text: String.raw`Phương trình nào sau đây là phương trình chính tắc của đường elip?`,
                options: [String.raw`$\dfrac{x^2}{a^2} - \dfrac{y^2}{b^2} = 1$ ($a>0, b>0$)`, String.raw`$\dfrac{x^2}{a^2} + \dfrac{y^2}{b^2} = 1$ ($a>b>0$)`, String.raw`$y^2 = 2px$ ($p>0$)`, String.raw`$x^2 + y^2 = R^2$ ($R>0$)`],
                correct: 1,
                explanation: String.raw`Phương trình chính tắc của đường elip có dạng $\dfrac{x^2}{a^2} + \dfrac{y^2}{b^2} = 1$ với điều kiện $a>b>0$. Các phương án khác lần lượt là hypebol, parabol và đường tròn.`
            },
            {
                text: String.raw`Tập xác định $D$ của hàm số $y = \log_a x$ (với $a>0, a \neq 1$) là:`,
                options: [String.raw`$D = \mathbb{R}$`, String.raw`$D = [0; +\infty)$`, String.raw`$D = \mathbb{R} \setminus \{0\}$`, String.raw`$D = (0; +\infty)$`],
                correct: 3,
                explanation: String.raw`Hàm số lôgarit $y = \log_a x$ chỉ xác định khi biểu thức dưới dấu lôgarit lớn hơn $0$, tức là $x > 0$. Vậy tập xác định là $D = (0; +\infty)$.`
            },
            {
                text: String.raw`Nghiệm của bất phương trình $\log_a x > \log_a y$ (với $0 < a < 1$ và $x, y > 0$) thỏa mãn điều kiện nào sau đây?`,
                options: [String.raw`$x > y$`, String.raw`$x < y$`, String.raw`$x = y$`, String.raw`$x \ge y$`],
                correct: 1,
                explanation: String.raw`Vì cơ số $a$ nằm trong khoảng $(0; 1)$ nên hàm số $y = \log_a t$ nghịch biến trên khoảng $(0; +\infty)$. Do đó, $\log_a x > \log_a y \Leftrightarrow x < y$.`
            },
            {
                text: String.raw`Thể tích $V$ của khối chóp có diện tích mặt đáy bằng $B$ và chiều cao bằng $h$ được tính bằng công thức nào dưới đây?`,
                options: [String.raw`$V = \dfrac{1}{3} B \cdot h$`, String.raw`$V = B \cdot h$`, String.raw`$V = 3B \cdot h$`, String.raw`$V = \dfrac{1}{2} B \cdot h$`],
                correct: 0,
                explanation: String.raw`Công thức tính thể tích của một khối chóp là $V = \dfrac{1}{3} B \cdot h$. Công thức $V = B \cdot h$ là của khối lăng trụ.`
            },
            {
                text: String.raw`Trong không gian $Oxyz$, cho hai vectơ $\vec{u}$ và $\vec{v}$ đều khác vectơ-không. Điều kiện cần và đủ để hai vectơ đó vuông góc với nhau là:`,
                options: [String.raw`$\vec{u} \cdot \vec{v} = 1$`, String.raw`$[\vec{u}, \vec{v}] = \vec{0}$`, String.raw`$\vec{u} \cdot \vec{v} = 0$`, String.raw`$\vec{u} = k\vec{v}$`],
                correct: 2,
                explanation: String.raw`Hai vectơ vuông góc với nhau khi và chỉ khi tích vô hướng của chúng bằng $0$, tức là $\vec{u} \cdot \vec{v} = 0$.`
            },
            {
                text: String.raw`Trong không gian $Oxyz$, phương trình mặt phẳng đi qua ba điểm $A(a;0;0)$, $B(0;b;0)$, $C(0;0;c)$ với $a, b, c \neq 0$ là:`,
                options: [String.raw`$ax + by + cz = 1$`, String.raw`$\dfrac{x}{a} + \dfrac{y}{b} + \dfrac{z}{c} = 1$`, String.raw`$\dfrac{x}{a} + \dfrac{y}{b} + \dfrac{z}{c} = 0$`, String.raw`$ax + by + cz = 0$`],
                correct: 1,
                explanation: String.raw`Phương trình mặt phẳng đi qua 3 điểm nằm trên 3 trục tọa độ (và không trùng với gốc tọa độ) được gọi là phương trình mặt phẳng theo đoạn chắn: $\dfrac{x}{a} + \dfrac{y}{b} + \dfrac{z}{c} = 1$.`
            },
            {
                text: String.raw`Cho cấp số cộng $(u_n)$ có số hạng đầu $u_1$ và công sai $d$. Công thức tính số hạng tổng quát $u_n$ là:`,
                options: [String.raw`$u_n = u_1 + nd$`, String.raw`$u_n = u_1 \cdot d^{n-1}$`, String.raw`$u_n = u_1 \cdot q^{n-1}$`, String.raw`$u_n = u_1 + (n-1)d$`],
                correct: 3,
                explanation: String.raw`Công thức tính số hạng thứ $n$ (số hạng tổng quát) của một cấp số cộng là $u_n = u_1 + (n-1)d$.`
            },
            {
                text: String.raw`Với $a$ là số thực dương tùy ý, $a \neq 1$, và $b, c$ là các số thực dương. Khẳng định nào sau đây đúng về phép trừ logarit?`,
                options: [String.raw`$\log_a b - \log_a c = \log_a \left(\dfrac{b}{c}\right)$`, String.raw`$\log_a b - \log_a c = \log_a(b - c)$`, String.raw`$\log_a b - \log_a c = \dfrac{\log_a b}{\log_a c}$`, String.raw`$\log_a b - \log_a c = \log_a(b \cdot c)$`],
                correct: 0,
                explanation: String.raw`Theo tính chất của lôgarit, hiệu của hai lôgarit cùng cơ số bằng lôgarit của một thương: $\log_a b - \log_a c = \log_a \left(\dfrac{b}{c}\right)$.`
            },
            {
                text: String.raw`Công thức tính diện tích mặt cầu có bán kính $R$ là:`,
                options: [String.raw`$S = 4\pi R^2$`, String.raw`$S = \pi R^2$`, String.raw`$S = \dfrac{4}{3}\pi R^3$`, String.raw`$S = 2\pi R^2$`],
                correct: 0,
                explanation: String.raw`Diện tích mặt cầu bán kính $R$ được tính theo công thức $S = 4\pi R^2$. Công thức $V = \dfrac{4}{3}\pi R^3$ là thể tích khối cầu.`
            },
            {
                text: String.raw`Cho hai biến cố $A$ và $B$ với $P(B) > 0$. Công thức tính xác suất của biến cố $A$ với điều kiện biến cố $B$ đã xảy ra (xác suất có điều kiện) là:`,
                options: [String.raw`$P(A|B) = \dfrac{P(A \cap B)}{P(A)}$`, String.raw`$P(A|B) = \dfrac{P(A \cap B)}{P(B)}$`, String.raw`$P(A|B) = P(A) \cdot P(B)$`, String.raw`$P(A|B) = P(A) + P(B) - P(A \cap B)$`],
                correct: 1,
                explanation: String.raw`Theo định nghĩa, xác suất có điều kiện của biến cố $A$ biết $B$ đã xảy ra được tính bởi công thức $P(A|B) = \dfrac{P(A \cap B)}{P(B)}$.`
            },
            {
                text: String.raw`Phương trình nào sau đây là phương trình chính tắc của đường hyperbol?`,
                options: [String.raw`$\dfrac{x^2}{a^2} + \dfrac{y^2}{b^2} = 1$ ($a>b>0$)`, String.raw`$\dfrac{x^2}{a^2} - \dfrac{y^2}{b^2} = 1$ ($a>0, b>0$)`, String.raw`$y^2 = 2px$ ($p>0$)`, String.raw`$x^2 + y^2 = R^2$ ($R>0$)`],
                correct: 1,
                explanation: String.raw`Phương trình chính tắc của đường hyperbol có dạng $\dfrac{x^2}{a^2} - \dfrac{y^2}{b^2} = 1$ với $a>0, b>0$.`
            },
            {
                text: String.raw`Phương trình đường tròn có tâm $I(a; b)$ và bán kính $R$ là:`,
                options: [String.raw`$(x-a)^2 + (y-b)^2 = R$`, String.raw`$(x+a)^2 + (y+b)^2 = R^2$`, String.raw`$(x-a)^2 + (y-b)^2 = R^2$`, String.raw`$x^2 + y^2 - 2ax - 2by = 0$`],
                correct: 2,
                explanation: String.raw`Đường tròn tâm $I(a;b)$, bán kính $R$ có phương trình là $(x-a)^2 + (y-b)^2 = R^2$.`
            },
            {
                text: String.raw`Cho mẫu số liệu ghép nhóm. Ý nghĩa thực tế của mốt (mode) là gì?`,
                options: [String.raw`Là giá trị chia mẫu số liệu thành hai phần bằng nhau.`, String.raw`Là giá trị trung bình của toàn bộ các số liệu.`, String.raw`Là giá trị đại diện cho nhóm có tần số lớn nhất (giá trị xuất hiện nhiều nhất/phổ biến nhất).`, String.raw`Là độ lệch chuẩn của mẫu số liệu.`],
                correct: 2,
                explanation: String.raw`Mốt của mẫu số liệu là giá trị có khả năng xuất hiện cao nhất, đại diện cho đặc điểm phổ biến nhất của mẫu.`
            },
            {
                text: String.raw`Ý nghĩa của các tứ phân vị $Q_1, Q_2, Q_3$ trong một mẫu số liệu là:`,
                options: [String.raw`Chia mẫu số liệu đã sắp xếp thành 3 phần có số lượng phần tử bằng nhau.`, String.raw`Chia mẫu số liệu đã sắp xếp thành 4 phần, mỗi phần chứa khoảng $25\%$ số lượng quan sát.`, String.raw`Đo lường mức độ phân tán của mẫu số liệu so với giá trị trung bình.`, String.raw`Chỉ ra các giá trị ngoại lệ của mẫu số liệu.`],
                correct: 1,
                explanation: String.raw`Các tứ phân vị $Q_1, Q_2, Q_3$ chia tập dữ liệu (đã sắp xếp theo thứ tự tăng dần) thành 4 phần, mỗi phần chứa khoảng $25\%$ số lượng phần tử.`
            },
            {
                text: String.raw`Với cơ số $a > 1$, nghiệm của bất phương trình $a^x > a^y$ thỏa mãn:`,
                options: [String.raw`$x < y$`, String.raw`$x > y$`, String.raw`$x = y$`, String.raw`$x \le y$`],
                correct: 1,
                explanation: String.raw`Vì cơ số $a > 1$ nên hàm số mũ $y = a^t$ đồng biến. Do đó $a^x > a^y \Leftrightarrow x > y$.`
            },
            {
                text: String.raw`Khẳng định nào sau đây đúng khi biến đổi biểu thức logarit (với $a, b, c > 0; a \neq 1$)?`,
                options: [String.raw`$\log_a b + \log_a c = \log_a (b+c)$`, String.raw`$\log_a b + \log_a c = \log_a (b \cdot c)$`, String.raw`$\log_a b + \log_a c = \log_a \left(\dfrac{b}{c}\right)$`, String.raw`$\log_a b + \log_a c = \log_a b \cdot \log_a c$`],
                correct: 1,
                explanation: String.raw`Tổng của hai lôgarit cùng cơ số bằng lôgarit của một tích: $\log_a b + \log_a c = \log_a (bc)$.`
            },
            {
                text: String.raw`Phương trình $e^u = b$ (với $b > 0$) có nghiệm $u$ là:`,
                options: [String.raw`$u = \log_b e$`, String.raw`$u = \ln b$`, String.raw`$u = \log b$`, String.raw`$u = e^b$`],
                correct: 1,
                explanation: String.raw`Theo định nghĩa logarit tự nhiên (cơ số $e$), ta có $e^u = b \Leftrightarrow u = \ln b$.`
            },
            {
                text: String.raw`Công thức tính số tiền nhận được cả vốn lẫn lãi (lãi kép) sau $n$ kỳ hạn, với số tiền gốc là $P$ và lãi suất $r$/kỳ hạn là:`,
                options: [String.raw`$A = P(1 + n \cdot r)$`, String.raw`$A = P(1 + r)^n$`, String.raw`$A = P \cdot r^n$`, String.raw`$A = P(1 + r^n)$`],
                correct: 1,
                explanation: String.raw`Công thức tính lãi kép là $A = P(1 + r)^n$, trong đó $P$ là tiền gốc, $r$ là lãi suất, $n$ là số kỳ.`
            },
            {
                text: String.raw`Theo công thức cộng xác suất, với hai biến cố $A$ và $B$ bất kỳ, ta có:`,
                options: [String.raw`$P(A \cup B) = P(A) + P(B)$`, String.raw`$P(A \cup B) = P(A) + P(B) - P(A \cap B)$`, String.raw`$P(A \cup B) = P(A) \cdot P(B)$`, String.raw`$P(A \cup B) = P(A) + P(B) + P(A \cap B)$`],
                correct: 1,
                explanation: String.raw`Công thức cộng xác suất tổng quát cho hai biến cố bất kỳ là $P(A \cup B) = P(A) + P(B) - P(A \cap B)$.`
            },
            {
                text: String.raw`Cho các biến cố $A_1, A_2$ lập thành một hệ đầy đủ và $B$ là một biến cố bất kỳ ($P(B)>0$). Công thức Bayes để tính xác suất hậu nghiệm $P(A_1|B)$ là:`,
                options: [String.raw`$P(A_1|B) = \dfrac{P(A_1) \cdot P(B|A_1)}{P(A_1) \cdot P(B|A_1) + P(A_2) \cdot P(B|A_2)}$`, String.raw`$P(A_1|B) = \dfrac{P(A_1) \cdot P(B)}{P(A_2) \cdot P(A_1|B)}$`, String.raw`$P(A_1|B) = P(A_1) \cdot P(B|A_1)$`, String.raw`$P(A_1|B) = \dfrac{P(B|A_1)}{P(B)}$`],
                correct: 0,
                explanation: String.raw`Dựa trên công thức Bayes và công thức xác suất toàn phần, ta có $P(A_1|B) = \dfrac{P(A_1)P(B|A_1)}{P(B)} = \dfrac{P(A_1)P(B|A_1)}{P(A_1)P(B|A_1) + P(A_2)P(B|A_2)}$.`
            },
            {
                text: String.raw`Phương trình tiếp tuyến của đồ thị hàm số $y = f(x)$ tại điểm có hoành độ $x_0$ là:`,
                options: [String.raw`$y = f'(x_0)(x - x_0)$`, String.raw`$y = f(x_0)(x - x_0) + f'(x_0)$`, String.raw`$y = f'(x_0)(x - x_0) + f(x_0)$`, String.raw`$y = f'(x_0)(x + x_0) - f(x_0)$`],
                correct: 2,
                explanation: String.raw`Phương trình tiếp tuyến tại điểm $M(x_0; y_0)$ là $y = f'(x_0)(x - x_0) + y_0$. Thay $y_0 = f(x_0)$, ta có phương án đúng.`
            },
            {
                text: String.raw`Đồ thị hàm số $y = \dfrac{u(x)}{v(x)}$ có điểm cực trị $(x_0; y_0)$. Công thức tính nhanh tung độ điểm cực trị $y_0$ (nếu $v'(x_0) \neq 0$) là:`,
                options: [String.raw`$y_0 = u'(x_0) - v'(x_0)$`, String.raw`$y_0 = \dfrac{u'(x_0)}{v'(x_0)}$`, String.raw`$y_0 = u'(x_0) \cdot v'(x_0)$`, String.raw`$y_0 = \dfrac{v'(x_0)}{u'(x_0)}$`],
                correct: 1,
                explanation: String.raw`Khi giải phương trình $y' = \dfrac{u'v - uv'}{v^2} = 0$, tại cực trị ta có $u'(x_0)v(x_0) - u(x_0)v'(x_0) = 0 \Rightarrow \dfrac{u(x_0)}{v(x_0)} = \dfrac{u'(x_0)}{v'(x_0)}$. Do đó $y_0 = \dfrac{u'(x_0)}{v'(x_0)}$.`
            },
            {
                text: String.raw`Giả sử $F(x)$ là một nguyên hàm của hàm số $f(x)$ trên đoạn $[a; b]$. Công thức Newton-Leibniz tính tích phân xác định của $f(x)$ từ $a$ đến $b$ là:`,
                options: [String.raw`$\int_a^b f(x)dx = F(a) - F(b)$`, String.raw`$\int_a^b f(x)dx = F(b) - F(a)$`, String.raw`$\int_a^b f(x)dx = F(b) + F(a)$`, String.raw`$\int_a^b f(x)dx = f(b) - f(a)$`],
                correct: 1,
                explanation: String.raw`Theo định lý Newton-Leibniz, tích phân xác định bằng hiệu giá trị của nguyên hàm tại cận trên và cận dưới: $\int_a^b f(x)dx = F(b) - F(a)$.`
            },
            {
                text: String.raw`Trong mặt phẳng, tam giác đều cạnh $a$ có công thức tính nhanh đường cao $h$ và diện tích $S$ lần lượt là:`,
                options: [String.raw`$h = \dfrac{a\sqrt{2}}{2}, S = \dfrac{a^2\sqrt{2}}{2}$`, String.raw`$h = \dfrac{a\sqrt{3}}{2}, S = \dfrac{a^2\sqrt{3}}{4}$`, String.raw`$h = \dfrac{a\sqrt{3}}{4}, S = \dfrac{a^2\sqrt{3}}{2}$`, String.raw`$h = a\sqrt{3}, S = a^2\sqrt{3}$`],
                correct: 1,
                explanation: String.raw`Tam giác đều cạnh $a$ có đường cao $h = \dfrac{a\sqrt{3}}{2}$ và diện tích $S = \dfrac{1}{2}ah = \dfrac{a^2\sqrt{3}}{4}$.`
            },
            {
                text: String.raw`Thể tích $V$ của khối lăng trụ có diện tích đáy $B$ và chiều cao $h$ là:`,
                options: [String.raw`$V = \dfrac{1}{3}Bh$`, String.raw`$V = 3Bh$`, String.raw`$V = \dfrac{1}{2}Bh$`, String.raw`$V = Bh$`],
                correct: 3,
                explanation: String.raw`Khối lăng trụ có thể tích được tính bằng diện tích đáy nhân với chiều cao, $V = Bh$.`
            },
            {
                text: String.raw`Thể tích $V$ của khối tứ diện đều cạnh $a$ được tính theo công thức nhanh nào sau đây?`,
                options: [String.raw`$V = \dfrac{a^3\sqrt{2}}{12}$`, String.raw`$V = \dfrac{a^3\sqrt{3}}{12}$`, String.raw`$V = \dfrac{a^3\sqrt{2}}{6}$`, String.raw`$V = \dfrac{a^3\sqrt{3}}{4}$`],
                correct: 0,
                explanation: String.raw`Thể tích tứ diện đều cạnh $a$ là $V = \dfrac{a^3\sqrt{2}}{12}$.`
            },
            {
                text: String.raw`Mặt phẳng $(P)$ cắt mặt cầu tâm $I$, bán kính $R$ theo giao tuyến là một đường tròn bán kính $r$. Gọi $d$ là khoảng cách từ $I$ đến $(P)$. Mối liên hệ giữa $R, r$ và $d$ là:`,
                options: [String.raw`$R^2 = r^2 + d^2$`, String.raw`$R = r + d$`, String.raw`$r^2 = R^2 + d^2$`, String.raw`$d^2 = R^2 + r^2$`],
                correct: 0,
                explanation: String.raw`Theo định lý Pytago trong tam giác vuông tạo bởi tâm mặt cầu, tâm đường tròn giao tuyến và một điểm trên giao tuyến, ta có $R^2 = r^2 + d^2$.`
            },
            {
                text: String.raw`Diện tích của một elip có độ dài trục lớn là $2a$ và độ dài trục bé là $2b$ được tính theo công thức:`,
                options: [String.raw`$S = 2\pi a b$`, String.raw`$S = \pi a^2 b^2$`, String.raw`$S = \pi a b$`, String.raw`$S = \pi (a+b)$`],
                correct: 2,
                explanation: String.raw`Diện tích của hình elip được tính bởi công thức $S = \pi ab$.`
            },
            {
                text: String.raw`Khi phân tích dữ liệu mức lương của nhân viên trong một tập đoàn, giám đốc nhân sự sử dụng tứ phân vị thứ nhất ($Q_1$). Ý nghĩa thực tế của $Q_1$ trong trường hợp này là gì?`,
                options: [String.raw`Mức lương trung bình của toàn bộ nhân viên trong tập đoàn.`, String.raw`Khoảng 25% số nhân viên có mức lương thấp hơn hoặc bằng $Q_1$.`, String.raw`Khoảng 75% số nhân viên có mức lương thấp hơn hoặc bằng $Q_1$.`, String.raw`Mức lương xuất hiện nhiều nhất trong bảng lương của tập đoàn.`],
                correct: 1,
                explanation: String.raw`Tứ phân vị thứ nhất $Q_1$ chia mẫu số liệu đã sắp xếp thành 2 phần, phần dưới chiếm 25% số liệu. Do đó, $Q_1$ đại diện cho mốc mà 25% nhân viên có mức lương thấp hơn hoặc bằng nó.`
            },
            {
                text: String.raw`Trong việc kiểm soát chất lượng sản phẩm (ví dụ: khối lượng các gói kẹo), kỹ sư nhà máy sử dụng khoảng tứ phân vị $\Delta_Q = Q_3 - Q_1$ để loại bỏ các sản phẩm lỗi (giá trị ngoại lệ). Một sản phẩm được coi là ngoại lệ (bất thường) khi khối lượng $x$ của nó thỏa mãn điều kiện nào?`,
                options: [String.raw`$x < Q_1 - 1.5\Delta_Q$ hoặc $x > Q_3 + 1.5\Delta_Q$`, String.raw`$x < Q_1 - \Delta_Q$ hoặc $x > Q_3 + \Delta_Q$`, String.raw`$Q_1 - 1.5\Delta_Q \le x \le Q_3 + 1.5\Delta_Q$`, String.raw`$x$ bé hơn giá trị trung bình cộng của mẫu.`],
                correct: 0,
                explanation: String.raw`Theo tiêu chuẩn thống kê, các giá trị nằm ngoài đoạn $[Q_1 - 1.5\Delta_Q ; Q_3 + 1.5\Delta_Q]$ được xem là các giá trị ngoại lệ (outliers).`
            },
            {
                text: String.raw`Một trạm phát sóng di động (BTS) được đặt tại điểm có tọa độ $(x_0; y_0)$ trên một bản đồ phẳng. Bán kính phủ sóng tối đa của trạm là $R$. Một người đứng tại tọa độ $(x; y)$ sẽ nhận được tín hiệu của trạm nếu tọa độ của người đó thỏa mãn:`,
                options: [String.raw`$(x - x_0)^2 + (y - y_0)^2 = R^2$`, String.raw`$(x - x_0)^2 + (y - y_0)^2 \le R^2$`, String.raw`$(x - x_0)^2 + (y - y_0)^2 \ge R^2$`, String.raw`$x^2 + y^2 \le R^2$`],
                correct: 1,
                explanation: String.raw`Vùng phủ sóng của trạm là một hình tròn tâm $(x_0; y_0)$ bán kính $R$. Người dùng phải nằm trong hoặc trên biên của hình tròn này, tức là $(x - x_0)^2 + (y - y_0)^2 \le R^2$.`
            },
            {
                text: String.raw`Trong vật lý, nếu phương trình $s(t)$ biểu diễn quãng đường đi được của một vật chuyển động theo thời gian $t$, thì ý nghĩa thực tế của đạo hàm bậc hai $s''(t)$ (với giả thiết đạo hàm này tồn tại) là gì?`,
                options: [String.raw`Vận tốc tức thời của vật tại thời điểm $t$.`, String.raw`Gia tốc tức thời của vật tại thời điểm $t$.`, String.raw`Xung lượng của lực tác dụng lên vật.`, String.raw`Công suất hoạt động của động cơ.`],
                correct: 1,
                explanation: String.raw`Đạo hàm bậc nhất $s'(t)$ là vận tốc $v(t)$. Đạo hàm bậc hai $s''(t) = v'(t)$ chính là gia tốc $a(t)$ của vật tại thời điểm $t$.`
            },
            {
                text: String.raw`Một công nhân kéo một xe chở hàng di chuyển một đoạn đường thẳng biểu diễn bởi vectơ $\vec{d}$. Lực kéo của công nhân không đổi và được biểu diễn bởi vectơ $\vec{F}$. Công $A$ do lực kéo sinh ra được tính bằng công thức toán học nào?`,
                options: [String.raw`$A = [\vec{F}, \vec{d}]$`, String.raw`$A = \dfrac{\vec{F}}{\vec{d}}$`, String.raw`$A = \vec{F} \cdot \vec{d}$`, String.raw`$A = |\vec{F}| + |\vec{d}|$`],
                correct: 2,
                explanation: String.raw`Trong vật lý, công cơ học do một lực không đổi sinh ra bằng tích vô hướng của vectơ lực tác dụng và vectơ độ dời: $A = \vec{F} \cdot \vec{d}$.`
            },
            {
                text: String.raw`Khi mua trả góp một chiếc xe máy, khách hàng chọn gói vay với lãi suất $r\%$/tháng, số tiền nợ giảm dần. Bản chất toán học của bài toán tính số tiền nợ còn lại sau $n$ tháng trả góp đều đặn là sự kết hợp của:`,
                options: [String.raw`Cấp số cộng và cấp số nhân.`, String.raw`Tích phân xác định.`, String.raw`Tổ hợp và chỉnh hợp.`, String.raw`Phương trình bậc hai.`],
                correct: 0,
                explanation: String.raw`Bài toán vay trả góp là sự kết hợp giữa số tiền gốc tăng trưởng theo cấp số nhân (do lãi kép) và số tiền hoàn trả định kỳ tích lũy tạo thành tổng của một cấp số nhân.`
            },
            {
                text: String.raw`Một người vay ngân hàng số tiền $A$ với lãi suất $r$/tháng theo hình thức trả góp hàng tháng. Biết rằng mỗi tháng người đó trả đều đặn số tiền $m$. Công thức tính số tiền còn nợ sau tháng thứ $n$ là:`,
                options: [
                    String.raw`$S_n = A(1+r)^n - m\dfrac{(1+r)^n - 1}{r}$`,
                    String.raw`$S_n = A(1+r)^n - m\dfrac{(1+r)^n + 1}{r}$`,
                    String.raw`$S_n = A(1+r)^n - m(1+r)^n$`,
                    String.raw`$S_n = A(1+r)^n - mn$`
                ],
                correct: 0,
                explanation: String.raw`Theo bài toán vay trả góp, số nợ sau $n$ tháng là hiệu giữa số tiền nợ (được tính lãi kép) và tổng các khoản tiền đã trả (cũng được tính lãi). Công thức đúng là $S_n = A(1+r)^n - m\dfrac{(1+r)^n - 1}{r}$.`
            }
        ];

        let quizQuestions = [];
        let isSubmitted = false;
        let startTime;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        window.onload = function() {
            quizQuestions = rawQuestions.map((q, index) => {
                let optionsList = q.options.map((opt, i) => ({ text: opt, isCorrect: i === q.correct }));
                shuffle(optionsList);
                let correctNewIndex = optionsList.findIndex(o => o.isCorrect);
                return {
                    id: index,
                    text: q.text,
                    options: optionsList,
                    correctIndex: correctNewIndex,
                    explanation: q.explanation
                };
            });
            shuffle(quizQuestions);

            renderQuestions();
            MathJax.typesetPromise();
            startTime = Date.now();
        };

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';
            const labels = ['A', 'B', 'C', 'D'];

            quizQuestions.forEach((q, qIndex) => {
                let qHtml = `<div class="question-box" id="qbox_${qIndex}">
                    <div class="question-text">Câu ${qIndex + 1}: ${q.text}</div>
                    <div class="options">`;
                
                q.options.forEach((opt, optIndex) => {
                    qHtml += `
                        <input type="radio" name="q_${qIndex}" id="q_${qIndex}_opt_${optIndex}" value="${optIndex}" class="option-input">
                        <label for="q_${qIndex}_opt_${optIndex}" class="option-label" id="label_q_${qIndex}_opt_${optIndex}">
                            <strong>${labels[optIndex]}.</strong> ${opt.text}
                        </label>
                    `;
                });

                qHtml += `</div>
                    <div class="explanation" id="expl_${qIndex}">
                        <strong>Lời giải:</strong> ${q.explanation}
                    </div>
                </div>`;
                
                container.innerHTML += qHtml;
            });
        }

        function submitQuiz() {
            if (isSubmitted) return;

            const name = document.getElementById('studentName').value.trim();
            const className = document.getElementById('className').value.trim();
            
            if (!name || !className) {
                alert('Vui lòng nhập đầy đủ Họ và tên, Lớp trước khi nộp bài!');
                return;
            }

            let attemptedCount = 0;
            quizQuestions.forEach((q, i) => {
                if (document.querySelector(`input[name="q_${i}"]:checked`)) attemptedCount++;
            });

            if (attemptedCount < (quizQuestions.length / 2)) {
                alert(`Bạn phải làm ít nhất 50% số câu (${Math.ceil(quizQuestions.length / 2)} câu) mới được nộp bài! Hiện tại bạn mới làm ${attemptedCount} câu.`);
                return;
            }

            if (!confirm('Bạn có chắc chắn muốn nộp bài?')) return;

            isSubmitted = true;
            let timeElapsed = Math.floor((Date.now() - startTime) / 1000);

            let score = 0;
            quizQuestions.forEach((q, i) => {
                let selected = document.querySelector(`input[name="q_${i}"]:checked`);
                if (selected && parseInt(selected.value) === q.correctIndex) {
                    score += 1; 
                }
                
                let inputs = document.querySelectorAll(`input[name="q_${i}"]`);
                inputs.forEach(inp => inp.disabled = true);
            });

            let percent = (score / quizQuestions.length) * 100;
            let feedbackHtml = '';
            
            if (percent < 60) {
                feedbackHtml = `<div class="alert alert-warning mt-3 mb-0" role="alert">Điểm của bạn chưa đạt 60%. Đừng nản lòng, hãy xem lại lời giải chi tiết và làm lại nhé! Cố lên! 💪</div>`;
                document.getElementById('retryBtn').style.display = 'inline-block';
            } else if (percent > 90) {
                feedbackHtml = `<div class="alert alert-success mt-3 mb-0" role="alert">Tuyệt vời! Bạn nắm lý thuyết rất vững. Xin chúc mừng! 🏆</div>`;
            } else {
                feedbackHtml = `<div class="alert alert-info mt-3 mb-0" role="alert">Bạn đã hoàn thành tốt bài thi. Hãy tiếp tục phát huy nhé! 👍</div>`;
            }

            document.getElementById('scoreArea').innerHTML = `<h2>ĐIỂM CỦA BẠN: ${score} / ${quizQuestions.length}</h2>` + feedbackHtml;
            document.getElementById('scoreArea').style.display = 'block';
            document.getElementById('submitBtn').style.display = 'none';
            
            // Hiện đáp án luôn
            showAnswers();
            
            // Gửi dữ liệu về Google Sheets (Cần thay bằng URL Web App Google Apps Script thật)
            const scriptURL = 'https://script.google.com/macros/s/AKfycbx1sSX9_SM0g4F6pBpPT2ezgoykp06g5dWFdfkCMwuYpJiaAE2xEqwwVdhviCk00hB2Ow/exec'; 
            let m = Math.floor(timeElapsed / 60).toString().padStart(2, '0');
            let s = (timeElapsed % 60).toString().padStart(2, '0');
            
            try {
                fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        timestamp: new Date().toISOString(),
                        student_name: name,
                        class_name: className,
                        score: score,
                        max_score: quizQuestions.length,
                        duration: `${m}:${s}`
                    })
                });
            } catch (e) {
                console.log("Sheet fetch error skipped");
            }
            
            window.scrollTo(0, 0);
        }

        function showAnswers() {
            quizQuestions.forEach((q, i) => {
                let selected = document.querySelector(`input[name="q_${i}"]:checked`);
                
                // Hiển thị đáp án đúng
                document.getElementById(`label_q_${i}_opt_${q.correctIndex}`).classList.add('correct-ans');
                
                // Nếu chọn sai, bôi đỏ đáp án đã chọn
                if (selected && parseInt(selected.value) !== q.correctIndex) {
                    document.getElementById(`label_q_${i}_opt_${selected.value}`).classList.add('wrong-ans');
                }
                
                // Hiện lời giải
                document.getElementById(`expl_${i}`).style.display = 'block';
            });
        }
    </script>
