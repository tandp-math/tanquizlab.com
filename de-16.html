                {
                    id: "p3_c4",
                    text: "Tập đoàn cơ khí EuroRide (Đức) độc quyền phân phối một dòng xe đạp điện cao cấp tại thị trường châu Âu. Chi phí sản xuất và vận chuyển mỗi chiếc xe là $500$ USD. Hiện tại, hãng đang niêm yết giá bán là $1200$ USD/chiếc, với lượng tiêu thụ trung bình đạt $2000$ chiếc/tháng. Bộ phận khảo sát thị trường của EuroRide nhận thấy rằng: cứ tăng giá bán thêm $1$ USD thì số lượng xe bán ra trong tháng sẽ giảm đi $5$ chiếc (và ngược lại, nếu giảm giá $1$ USD thì lượng xe bán ra tăng $5$ chiếc). Ủy ban thương mại dự định áp thuế bảo vệ môi trường là $t$ (USD) trên mỗi chiếc xe đạp điện bán ra ($0 < t < 1100$). Biết ban giám đốc EuroRide luôn điều chỉnh giá bán $p$ (USD) sao cho lợi nhuận thu về (sau khi trừ thuế) là cao nhất. Hỏi cơ quan quản lý cần quy định mức thuế $t$ bằng bao nhiêu (USD/chiếc) để tổng số tiền thuế thu được mỗi tháng là lớn nhất?",
                    correctAnswer: 550,
                    explanation: "Mối liên hệ giữa lượng bán $Q$ và giá $p$: $Q(p) = 2000 - 5(p - 1200) = 8000 - 5p$.<br>" +
                                 "Lợi nhuận sau thuế: $L(p) = (p - 500 - t)(8000 - 5p)$. Đây là parabol đạt cực đại tại đỉnh: $p^*(t) = \\dfrac{(500+t)+1600}{2} = \\dfrac{t+2100}{2}$.<br>" +
                                 "Khi đó lượng bán: $Q^*(t) = 8000 - 5 \\cdot \\dfrac{t+2100}{2} = \\dfrac{5500 - 5t}{2}$.<br>" +
                                 "Tổng tiền thuế thu được: $T(t) = t \\cdot Q^*(t) = \\dfrac{-5}{2}t^2 + 2750t$. Hàm số đạt giá trị lớn nhất tại đỉnh $t = \\dfrac{-2750}{2 \\cdot (-2,5)} = 550$ USD/chiếc."
                }
            ]
        };

        // --- HÀM TRỘN NGẪU NHIÊN ---
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // --- RENDER ĐỀ THI ---
        function buildExam() {
            let html = "";

            // PHẦN I
            html += `<h4 class="part-title">PHẦN I. Câu hỏi trắc nghiệm nhiều phương án lựa chọn</h4>`;
            html += `<p class="fw-semibold text-muted ps-2">Thí sinh trả lời từ câu 1 đến câu 12. Mỗi câu hỏi thí sinh chỉ chọn một phương án. (Mỗi câu đúng được 0.25 điểm)</p>`;
            let p1Shuffled = shuffle([...examData.part1]);
            p1Shuffled.forEach((q, index) => {
                let optsShuffled = shuffle([...q.options]);
                html += `<div class="question-box" id="box_${q.id}">
                            <div class="fw-bold mb-2">Câu ${index + 1}. <span class="fw-normal">${q.text}</span></div>
                            <div class="row">`;
                optsShuffled.forEach((opt, oIdx) => {
                    let letter = String.fromCharCode(65 + oIdx);
                    html += `<div class="col-md-6">
                                <label class="option-label" id="lbl_${q.id}_${oIdx}">
                                    <input type="radio" name="${q.id}" value="${opt.isCorrect}" class="option-input">
                                    <span class="fw-bold">${letter}.</span> <span class="option-text">${opt.text}</span>
                                </label>
                             </div>`;
                });
                html += `   </div>
                            <div class="explanation" id="exp_${q.id}"></div>
                         </div>`;
            });

            // PHẦN II
            html += `<h4 class="part-title">PHẦN II. Câu hỏi trắc nghiệm đúng sai</h4>`;
            html += `<p class="fw-semibold text-muted ps-2">Thí sinh trả lời từ câu 1 đến câu 4. Trong mỗi ý a), b), c), d) ở mỗi câu, thí sinh chọn đúng hoặc sai.</p>`;
            let p2Shuffled = shuffle([...examData.part2]);
            p2Shuffled.forEach((q, index) => {
                html += `<div class="question-box" id="box_${q.id}">
                            <div class="fw-bold mb-3">Câu ${index + 1}. <span class="fw-normal">${q.text}</span></div>
                            <div class="table-responsive">
                                <table class="table table-bordered true-false-table align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Các phát biểu / ý hỏi</th>
                                            <th style="width: 90px;">Đúng</th>
                                            <th style="width: 90px;">Sai</th>
                                        </tr>
                                    </thead>
                                    <tbody>`;
                q.statements.forEach((st, sIdx) => {
                    let letters = ['a', 'b', 'c', 'd'];
                    html += `<tr id="tr_${q.id}_${sIdx}">
                                <td><span class="fw-bold">${letters[sIdx]})</span> ${st.text}</td>
                                <td><input type="radio" name="${q.id}_${sIdx}" value="true" data-correct="${st.isTrue}" class="tf-radio form-check-input"></td>
                                <td><input type="radio" name="${q.id}_${sIdx}" value="false" data-correct="${!st.isTrue}" class="tf-radio form-check-input"></td>
                             </tr>`;
                });
                html += `           </tbody>
                                </table>
                            </div>
                            <div class="explanation" id="exp_${q.id}"></div>
                         </div>`;
            });

            // PHẦN III
            html += `<h4 class="part-title">PHẦN III. Câu trắc nghiệm trả lời ngắn</h4>`;
            html += `<p class="fw-semibold text-muted ps-2">Thí sinh trả lời từ câu 1 đến câu 4. Điền đáp án dạng số vào ô trống. (Mỗi câu đúng được 0.5 điểm)</p>`;
            let p3Shuffled = shuffle([...examData.part3]);
            p3Shuffled.forEach((q, index) => {
                html += `<div class="question-box" id="box_${q.id}">
                            <div class="fw-bold mb-2">Câu ${index + 1}. <span class="fw-normal">${q.text}</span></div>
                            <div class="mt-2">
                                <input type="text" class="form-control short-ans-input" name="${q.id}" data-answer="${q.correctAnswer}" placeholder="Nhập đáp án số...">
                            </div>
                            <div class="explanation" id="exp_${q.id}"></div>
                         </div>`;
            });

            document.getElementById("examContent").innerHTML = html;
            if (window.MathJax && window.MathJax.typeset) {
                window.MathJax.typeset();
            }
        }

        // --- ĐỒNG HỒ ĐẾM NGƯỢC ---
        let timeRemaining = 90 * 60;
        const timerDisplay = document.getElementById("timerDisplay");
        let countdown = setInterval(() => {
            timeRemaining--;
            let mins = Math.floor(timeRemaining / 60);
            let secs = timeRemaining % 60;
            timerDisplay.innerText = `Thời gian còn lại: ${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
            if (timeRemaining <= 0) {
                clearInterval(countdown);
                alert("Hết giờ làm bài! Hệ thống tự động nộp bài.");
                processSubmission(true);
            }
        }, 1000);

        // --- CHỐNG GIAN LẬN (CHUYỂN TAB) ---
        let tabViolations = 0;
        let lastViolationTime = 0;
        let isSubmitted = false;
        let completedAtLeastHalf = false;

        function handleViolation() {
            if (isSubmitted) return;
            let now = Date.now();
            if (now - lastViolationTime < 1000) return; // Chống nháy sự kiện liên tục
            lastViolationTime = now;
            
            tabViolations++;
            
            if (tabViolations > 5) {
                alert("Bạn đã chuyển tab quá số lần cho phép. Bài thi bị nộp tự động và điểm bị giảm 50%.");
                processSubmission(true, true);
            } else if (tabViolations >= 4) {
                alert(`CẢNH BÁO ĐỎ: Bạn đã rời khỏi trang thi ${tabViolations} lần! Vượt quá 5 lần sẽ bị thu bài và trừ 50% số điểm.`);
            } else {
                alert(`Cảnh báo: Bạn không được chuyển tab hoặc rời khỏi trang thi. (Vi phạm: ${tabViolations}/5 lần)`);
            }
        }

        document.addEventListener("visibilitychange", () => {
            if (document.hidden) handleViolation();
        });

        window.addEventListener("blur", () => {
            handleViolation();
        });

        // --- XỬ LÝ CHẤM ĐIỂM TỰ ĐỘNG VÀ HIỂN THỊ KẾT QUẢ ---
        function processSubmission(force = false, isPenalty = false) {
            let totalQuestionsCount = 12 + 4 + 4; // Tổng câu lớn
            let answeredCount = 0;

            // Kiểm tra tiến độ làm bài
            examData.part1.forEach(q => {
                if (document.querySelector(`input[name="${q.id}"]:checked`)) answeredCount++;
            });
            examData.part2.forEach(q => {
                let done = false;
                for (let i = 0; i < 4; i++) {
                    if (document.querySelector(`input[name="${q.id}_${i}"]:checked`)) done = true;
                }
                if (done) answeredCount++;
            });
            examData.part3.forEach(q => {
                if (document.querySelector(`input[name="${q.id}"]`).value.trim() !== "") answeredCount++;
            });

            if (!force && answeredCount < (totalQuestionsCount / 2)) {
                alert(`Bạn mới làm được ${answeredCount}/${totalQuestionsCount} câu. Cần hoàn thành tối thiểu 50% số câu (10 câu) để nộp bài.`);
                return;
            }

            completedAtLeastHalf = true;
            isSubmitted = true;
            clearInterval(countdown);

            let scoreP1 = 0;
            let scoreP2 = 0;
            let scoreP3 = 0;

            // Chấm phần I
            examData.part1.forEach(q => {
                let selected = document.querySelector(`input[name="${q.id}"]:checked`);
                if (selected && selected.value === "true") {
                    scoreP1 += 0.25;
                }
            });

            // Chấm phần II
            examData.part2.forEach(q => {
                let correctSubCount = 0;
                for (let i = 0; i < 4; i++) {
                    let selected = document.querySelector(`input[name="${q.id}_${i}"]:checked`);
                    if (selected && selected.getAttribute('data-correct') === "true") {
                        correctSubCount++;
                    }
                }
                if (correctSubCount === 1) scoreP2 += 0.1;
                else if (correctSubCount === 2) scoreP2 += 0.25;
                else if (correctSubCount === 3) scoreP2 += 0.5;
                else if (correctSubCount === 4) scoreP2 += 1.0;
            });

            // Chấm phần III
            examData.part3.forEach(q => {
                let inputVal = document.querySelector(`input[name="${q.id}"]`).value.trim();
                if (inputVal !== "") {
                    let userNum = parseFloat(inputVal.replace(',', '.'));
                    let correctNum = parseFloat(q.correctAnswer);
                    if (!isNaN(userNum) && Math.abs(userNum - correctNum) < 0.001) {
                        scoreP3 += 0.5;
                    }
                }
            });

            let finalScore = scoreP1 + scoreP2 + scoreP3;
            let maxScore = 9.0; // 12*0.25 + 4*1 + 4*0.5

            if (isPenalty) {
                finalScore = finalScore / 2;
            }

            // Hiển thị điểm số
            let scoreDisplay = document.getElementById("scoreDisplay");
            scoreDisplay.innerHTML = `KẾT QUẢ BÀI LÀM: <span class="text-danger">${finalScore.toFixed(2)}</span> / ${maxScore.toFixed(2)} điểm.${isPenalty ? '<br><small class="text-danger">Đã bị trừ 50% điểm do vi phạm chuyển tab.</small>' : ''}<br>` +
                                     `<small class="text-muted">(Phần I: ${scoreP1.toFixed(2)}đ | Phần II: ${scoreP2.toFixed(2)}đ | Phần III: ${scoreP3.toFixed(2)}đ)</small>`;
            scoreDisplay.style.display = "block";

            // Khóa toàn bộ form
            document.querySelectorAll('input').forEach(el => el.disabled = true);
            document.getElementById("btnSubmit").style.display = "none";
            document.getElementById("btnShowAnswers").style.display = "inline-block";

            // Gửi dữ liệu về Google Sheets
            let sName = document.getElementById("studentName").value.trim() || "Thí sinh ẩn danh";
            let cName = document.getElementById("className").value.trim() || "Tự do";
            
            let timeUsedSeconds = 90 * 60 - timeRemaining;
            let durationMinutes = Math.round(timeUsedSeconds / 60);

            let payload = {
                timestamp: new Date().toLocaleString('vi-VN'),
                student_name: sName,
                class_name: cName,
                score_p1: scoreP1.toFixed(2),
                score_p2: scoreP2.toFixed(2),
                score_p3: scoreP3.toFixed(2),
                score: finalScore.toFixed(2),
                total_score: finalScore.toFixed(2),
                max_score: maxScore.toFixed(2),
                percent: ((finalScore / maxScore) * 100).toFixed(1) + "%",
                tab_violation: tabViolations,
                duration: durationMinutes + " phút"
            };

            let scriptURL = "https://script.google.com/macros/s/AKfycbzZhRAFuNNXaqS_HDhXkCJGdfAkgPWlk0cy36kgHAJWVe1fiN2_oh3LT4wiKmADWTiSuQ/exec"; 
            fetch(scriptURL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams(payload)
            }).then(() => console.log("Gửi phản hồi dữ liệu Google Sheet thành công!"))
              .catch(err => console.error("Lỗi gửi dữ liệu Google Sheet: ", err));

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById("btnSubmit").addEventListener("click", () => {
            processSubmission(false);
        });

        // --- HIỂN THỊ ĐÁP ÁN CHI TIẾT ---
        document.getElementById("btnShowAnswers").addEventListener("click", () => {
            if (!completedAtLeastHalf) return;

            examData.part1.forEach(q => {
                document.getElementById(`exp_${q.id}`).innerHTML = q.explanation;
                document.getElementById(`exp_${q.id}`).style.display = "block";
                
                let radios = document.getElementsByName(q.id);
                radios.forEach((r, idx) => {
                    let lbl = document.getElementById(`lbl_${q.id}_${idx}`);
                    if (r.value === "true") {
                        lbl.classList.add("correct-ans");
                    } else if (r.checked) {
                        lbl.classList.add("wrong-ans");
                    }
                });
            });

            examData.part2.forEach(q => {
                document.getElementById(`exp_${q.id}`).innerHTML = q.explanation;
                document.getElementById(`exp_${q.id}`).style.display = "block";

                for (let i = 0; i < 4; i++) {
                    let checkedRadio = document.querySelector(`input[name="${q.id}_${i}"]:checked`);
                    let tr = document.getElementById(`tr_${q.id}_${i}`);
                    if (checkedRadio) {
                        if (checkedRadio.getAttribute('data-correct') === "true") {
                            tr.classList.add("table-success");
                        } else {
                            tr.classList.add("table-danger");
                        }
                    } else {
                        tr.classList.add("table-light");
                    }
                }
            });

            examData.part3.forEach(q => {
                document.getElementById(`exp_${q.id}`).innerHTML = q.explanation + `<br><strong class="text-success">Đáp án chuẩn: ${q.correctAnswer.toString().replace('.', ',')}</strong>`;
                document.getElementById(`exp_${q.id}`).style.display = "block";

                let inputEl = document.querySelector(`input[name="${q.id}"]`);
                let userVal = inputEl.value.trim().replace(',', '.');
                if (parseFloat(userVal) === parseFloat(q.correctAnswer)) {
                    inputEl.classList.add("is-valid");
                } else {
                    inputEl.classList.add("is-invalid");
                }
            });

            if (window.MathJax && window.MathJax.typeset) {
                window.MathJax.typeset();
            }
            document.getElementById("btnShowAnswers").disabled = true;
        });

        // --- IN ĐỀ THI ---
        document.getElementById("btnPrint").addEventListener("click", () => {
            window.print();
        });

        // Tự động khởi tạo
        window.onload = buildExam;
    </script>
</body>
</html>
