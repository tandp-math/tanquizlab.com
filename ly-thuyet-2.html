        options: ["$(0; y_0; z_0)$.", "$(x_0; 0; 0)$.", "$(x_0; y_0; 0)$.", "$(0; 0; z_0)$."], 
        explain: "Hình chiếu của điểm $M$ lên mặt phẳng $(Oyz)$ thì giữ nguyên tung độ và cao độ, cho hoành độ bằng $0$, do đó tọa độ là $(0; y_0; z_0)$." 
    },
    {

        options: ["$(-x_0; y_0; -z_0)$.", "$(x_0; -y_0; z_0)$.", "$(0; y_0; 0)$.", "$(-x_0; -y_0; -z_0)$."], 
        explain: "Lấy đối xứng qua trục $Oy$ thì giữ nguyên tung độ $y_0$, các tọa độ còn lại $(x_0, z_0)$ đổi dấu, do đó tọa độ là $(-x_0; y_0; -z_0)$." 
    },
    { 
        text: "Cho cơ số $a > 0, a \\ne 1$ và $u > 0$. Khi $\\log_a u = b$ thì $u$ bằng bao nhiêu?",

        explain: "Theo đúng định nghĩa của logarit, $\\log_a u = b \\Leftrightarrow u = a^b$." 
    },
    { 
        text: "Cho hàm số $f(x)$ có đạo hàm $f'(x) = (x-a)(x-b)^2(x-c)^3$ với $a, b, c$ là các số thực phân biệt. Hàm số $f(x)$ có bao nhiêu điểm cực trị?", 
        options: ["$2$.", "$3$.", "$1$.", "$6$."], 
        explain: "Hàm số đạt cực trị tại các điểm mà đạo hàm đổi dấu. Phương trình $f'(x) = 0$ có nghiệm $x=a$ (nghiệm bội $1$), $x=b$ (nghiệm bội $2$) và $x=c$ (nghiệm bội $3$). Do đó $f'(x)$ chỉ đổi dấu khi đi qua $x=a$ và $x=c$. Vậy hàm số có 2 điểm cực trị." 
    },

        options: ["$d(M, \\Delta) = \\dfrac{\\left| \\left[ \\overrightarrow{M_0M}, \\vec{u} \\right] \\right|}{|\\vec{u}|}$.", "$d(M, \\Delta) = \\dfrac{\\left| \\left[ \\overrightarrow{M_0M}, \\vec{u} \\right] \\right|}{|\\overrightarrow{M_0M}|}$.", "$d(M, \\Delta) = \\dfrac{\\left| \\overrightarrow{M_0M} \\cdot \\vec{u} \\right|}{|\\vec{u}|}$.", "$d(M, \\Delta) = \\dfrac{\\left| \\left[ \\overrightarrow{M_0M}, \\vec{u} \\right] \\right|}{2|\\vec{u}|}$."], 
        explain: "Công thức chuẩn tính khoảng cách từ một điểm đến một đường thẳng trong không gian $Oxyz$ là $d(M, \\Delta) = \\dfrac{\\left| \\left[ \\overrightarrow{M_0M}, \\vec{u} \\right] \\right|}{|\\vec{u}|}$." 
    },
    { 
        text: "Trong không gian $Oxyz$, cho hai đường thẳng chéo nhau $\\Delta_1$ (đi qua $M_1$, có VTCP $\\vec{u_1}$) và $\\Delta_2$ (đi qua $M_2$, có VTCP $\\vec{u_2}$). Khoảng cách giữa $\\Delta_1$ và $\\Delta_2$ là",

        explain: "Khoảng cách giữa hai đường thẳng chéo nhau được tính bởi công thức $d(\\Delta_1, \\Delta_2) = \\dfrac{\\left| \\left[ \\vec{u_1}, \\vec{u_2} \\right] \\cdot \\overrightarrow{M_1M_2} \\right|}{\\left| \\left[ \\vec{u_1}, \\vec{u_2} \\right] \\right|}$." 
    },
    { 
        text: "Cho hai vectơ $\\vec{a}$ và $\\vec{b}$ khác vectơ-không. Công thức tính tích vô hướng của hai vectơ theo góc giữa chúng là", 
        options: ["$\\vec{a} \\cdot \\vec{b} = |\\vec{a}| \\cdot |\\vec{b}| \\cdot \\cos(\\vec{a}, \\vec{b})$.", "$\\vec{a} \\cdot \\vec{b} = |\\vec{a}| \\cdot |\\vec{b}| \\cdot \\sin(\\vec{a}, \\vec{b})$.", "$\\vec{a} \\cdot \\vec{b} = \\dfrac{1}{2}|\\vec{a}| \\cdot |\\vec{b}| \\cdot \\cos(\\vec{a}, \\vec{b})$.", "$\\vec{a} \\cdot \\vec{b} = |\\vec{a}| \\cdot |\\vec{b}|$."], 
        explain: "Theo định nghĩa, tích vô hướng của hai vectơ là một số thực được tính bằng $\\vec{a} \\cdot \\vec{b} = |\\vec{a}| \\cdot |\\vec{b}| \\cdot \\cos(\\vec{a}, \\vec{b})$." 
    }

// Biến trạng thái
let examData = {
    code: Math.floor(100 + Math.random() * 900).toString(),
    questions: [],
    startTime: Date.now(),
    isSubmitted: false
};

// Hàm trộn mảng ngẫu nhiên
function shuffleArray(arr) {
    let array = [...arr];
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

// ==========================================
// KHỞI TẠO VÀ RENDER
// ==========================================
function initData() {
    // Trộn toàn bộ câu hỏi
    let selectedQ = shuffleArray(questionBank);
    
    examData.questions = selectedQ.map((q, idx) => {
        let opts = [
            { id: 'A', text: q.options[0], isCorrect: true },
            { id: 'B', text: q.options[1], isCorrect: false },
            { id: 'C', text: q.options[2], isCorrect: false },
            { id: 'D', text: q.options[3], isCorrect: false }
        ];
        return {
            id: 'q' + idx,
            text: q.text,
            options: shuffleArray(opts),
            explain: q.explain,
            userAns: null
        };
    });
}

function renderExam() {
    document.getElementById('examCode').innerText = examData.code;
    
    let html = '';
    examData.questions.forEach((q, idx) => {
        html += `
        <div class="question-block" id="block-${q.id}">
            <div class="question-text"><strong>Câu ${idx + 1}:</strong> ${q.text}</div>
            <div class="row">`;
        
        const letters = ['A', 'B', 'C', 'D'];
        q.options.forEach((opt, oIdx) => {
            let isChecked = q.userAns === opt.id ? 'checked' : '';
            let disabled = examData.isSubmitted ? 'disabled' : '';
            
            html += `
                <div class="col-md-6 col-12">
                    <label class="option-label">
                        <input type="radio" class="option-input" name="${q.id}" value="${opt.id}" 
                               ${isChecked} ${disabled} onchange="saveAns(${idx}, '${opt.id}')">
                        <span><strong>${letters[oIdx]}.</strong> ${opt.text}</span>
                    </label>
                </div>`;
        });
        
        html += `</div>
            <div class="explanation" id="exp-${q.id}">
                <div class="mt-2 mb-2">Đáp án đúng: <strong>${letters[q.options.findIndex(o=>o.isCorrect)]}</strong></div>
                <div><strong>Lời giải:</strong> ${q.explain}</div>
            </div>
        </div>`;
    });
    
    document.getElementById('part1').innerHTML = html;

    // Render lại toán học
    if (window.MathJax) MathJax.typesetPromise();
}

// ==========================================
// LƯU TRỮ VÀ KHÔI PHỤC
// ==========================================
function saveAns(idx, val) {
    examData.questions[idx].userAns = val;
    saveLocal();
}

function saveLocal() {
    if(examData.isSubmitted) return;
    examData.studentName = document.getElementById('studentName').value;
    examData.studentClass = document.getElementById('studentClass').value;
    localStorage.setItem('mathExamFullP1_UpdateV2', JSON.stringify(examData));
}

function loadLocal() {
    let saved = localStorage.getItem('mathExamFullP1_UpdateV2');
    if (saved) {
        let parsed = JSON.parse(saved);
        examData = parsed;
        document.getElementById('studentName').value = examData.studentName || '';
        document.getElementById('studentClass').value = examData.studentClass || '';
        
        if(!examData.isSubmitted) {
            document.getElementById('restoreMsg').style.display = 'block';
            setTimeout(() => document.getElementById('restoreMsg').style.display = 'none', 3000);
        } else {
            showResults();
        }
    } else {
        initData();
    }
    renderExam();
}

// Auto save mỗi 10s
setInterval(saveLocal, 10000);

// ==========================================
// XỬ LÝ NỘP BÀI
// ==========================================
function submitExam() {
    let name = document.getElementById('studentName').value.trim();
    let cls = document.getElementById('studentClass').value.trim();
    
    if(!name || !cls) {
        alert("Vui lòng điền đầy đủ Họ tên và Lớp trước khi nộp bài!");
        return;
    }

    let totalQuestions = examData.questions.length;
    let answered = examData.questions.filter(q => q.userAns !== null).length;
    let percent = (answered / totalQuestions) * 100;

    if (percent < 50) {
        alert(`Bạn mới làm được ${percent.toFixed(1)}% (${answered}/${totalQuestions} câu). Cần làm ít nhất 50% số câu hỏi mới được nộp bài!`);
        return;
    }

    if (!confirm("Bạn có chắc chắn muốn nộp bài?")) return;

    examData.isSubmitted = true;
    examData.studentName = name;
    examData.studentClass = cls;
    
    // Tính điểm (Thang điểm 10 quy đổi cho tổng số câu)
    let correctCount = 0;
    examData.questions.forEach(q => {
        let correctOpt = q.options.find(o => o.isCorrect).id;
        if (q.userAns === correctOpt) correctCount++;
    });

    examData.correctCount = correctCount;
    // Điểm tính theo thang 10
    examData.score = (correctCount / totalQuestions) * 10;
    examData.timeTaken = Math.round((Date.now() - examData.startTime) / 60000);
    if(examData.timeTaken < 1) examData.timeTaken = 1; // Tối thiểu 1 phút
    examData.percent = percent.toFixed(1);

    localStorage.setItem('mathExamFullP1_UpdateV2', JSON.stringify(examData));
    
    sendToGoogleSheet();
    showResults();
}

function showResults() {
    document.getElementById('submitArea').style.display = 'none';
    
    // Khóa input thông tin
    document.getElementById('studentName').disabled = true;
    document.getElementById('studentClass').disabled = true;

    // Hiển thị khung kết quả
    document.getElementById('resultBox').style.display = 'block';
    document.getElementById('resName').innerText = examData.studentName;
    document.getElementById('resClass').innerText = examData.studentClass;
    document.getElementById('correctCount').innerText = examData.correctCount;
    document.getElementById('totalCount').innerText = examData.questions.length;
    document.getElementById('totalScore').innerText = examData.score.toFixed(2);
    document.getElementById('timeTaken').innerText = examData.timeTaken;
    document.getElementById('percentDone').innerText = examData.percent;

    // Đánh dấu đúng/sai từng câu
    examData.questions.forEach(q => {
        let correctOpt = q.options.find(o => o.isCorrect).id;
        let block = document.getElementById(`block-${q.id}`);
        
        if (q.userAns === correctOpt) {
            block.style.borderColor = '#198754';
            block.style.backgroundColor = '#f0fdf4';
        } else {
            block.style.borderColor = '#dc3545';
            block.style.backgroundColor = '#fff5f5';
        }
        
        document.getElementById(`exp-${q.id}`).style.display = 'block';
    });
    
    renderExam(); // Render lại để áp dụng thuộc tính disabled cho các radio
}

function reviewExam() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ==========================================
// GỬI GOOGLE SHEETS
// ==========================================
function sendToGoogleSheet() {
    if(GAS_URL === "YOUR_GOOGLE_APPS_SCRIPT_URL") return;
    
    let payload = {
        student_name: examData.studentName,
        class_name: examData.studentClass,
        score: examData.score,
        total_score: examData.score,
        submit_time: new Date().toLocaleString('vi-VN'),
        duration_minutes: examData.timeTaken,
        percent: examData.percent
    };

    fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    }).catch(err => console.log("Lỗi gửi dữ liệu:", err));
}

// Khởi chạy khi load trang
window.onload = loadLocal;

</script>
