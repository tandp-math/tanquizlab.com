<style>
/* ── TOKENS ── */
:root {
  --ink:     #1a1207;
  --paper:   #fdf6e3;
  --cream:   #f5ead0;
  --gold:    #b8860b;
  --gold2:   #d4a017;
  --rust:    #c0392b;
  --teal:    #0e6655;
  --teal2:   #1abc9c;
  --rule:    #d6c9a5;
  --correct-bg: #d4edda;
  --correct-bd: #28a745;
  --wrong-bg:   #f8d7da;
  --wrong-bd:   #dc3545;
  --shadow: 0 4px 24px rgba(0,0,0,.12);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Source Serif 4', Georgia, serif;
  background: var(--cream);
  color: var(--ink);
  min-height: 100vh;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(184,134,11,.06) 28px);
}

/* ── HEADER ── */
.site-header {
  background: var(--ink);
  color: var(--paper);
  padding: 28px 32px 20px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.site-header::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    -45deg,
    transparent, transparent 10px,
    rgba(184,134,11,.07) 10px, rgba(184,134,11,.07) 11px
  );
}
.school-name {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.1rem, 2.5vw, 1.4rem);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--gold2);
  position: relative;
}
.teacher-name {
  font-size: .9rem;
  opacity: .7;
  margin-top: 4px;
  position: relative;
  font-style: italic;
}
.quiz-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.6rem, 4vw, 2.4rem);
  font-weight: 900;
  margin-top: 10px;
  letter-spacing: .02em;
  position: relative;
}
.gold-rule {
  width: 80px; height: 3px;
  background: linear-gradient(90deg, transparent, var(--gold2), transparent);
  margin: 12px auto 0;
  position: relative;
}

/* ── CONTROL BAR ── */
.ctrl-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  padding: 16px 32px;
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
  position: sticky;
  top: 0;
  z-index: 100;
}
.timer-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
}
.timer-label { font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; opacity: .6; }
#timer {
  font-family: 'Playfair Display', serif;
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--rust);
  min-width: 90px;
  transition: color .3s;
}
#timer.warning { color: var(--rust); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

.progress-wrap { flex: 1; min-width: 160px; }
.progress-label { font-size: .75rem; opacity: .6; margin-bottom: 4px; }
.progress-track {
  height: 6px;
  background: var(--rule);
  border-radius: 99px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold), var(--teal2));
  border-radius: 99px;
  width: 0%;
  transition: width .4s ease;
}

.btn {
  padding: 9px 20px;
  border: none;
  border-radius: 6px;
  font-family: 'Source Serif 4', serif;
  font-size: .9rem;
  cursor: pointer;
  transition: all .2s;
  font-weight: 600;
  letter-spacing: .03em;
}
.btn-gold {
  background: var(--gold);
  color: #fff;
}
.btn-gold:hover { background: var(--gold2); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(184,134,11,.4); }
.btn-teal {
  background: var(--teal);
  color: #fff;
}
.btn-teal:hover { background: var(--teal2); transform: translateY(-1px); }
.btn-outline {
  background: transparent;
  border: 2px solid var(--ink);
  color: var(--ink);
}
.btn-outline:hover { background: var(--ink); color: var(--paper); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none !important; }

/* ── RESULT BOX ── */
#result-banner {
  display: none;
  margin: 24px 32px;
  padding: 24px 28px;
  background: var(--paper);
  border: 2px solid var(--gold);
  border-radius: 12px;
  box-shadow: var(--shadow);
  text-align: center;
}
#result-banner h2 {
  font-family: 'Playfair Display', serif;
  font-size: 1.8rem;
  color: var(--gold);
  margin-bottom: 8px;
}
.score-ring {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 110px; height: 110px;
  border-radius: 50%;
  border: 6px solid var(--gold);
  font-family: 'Playfair Display', serif;
  font-size: 2.4rem;
  font-weight: 900;
  color: var(--gold);
  margin: 16px auto;
  background: radial-gradient(circle, #fffbf0, var(--cream));
}
.score-detail { font-size: 1rem; opacity: .75; margin-top: 6px; }

/* ── QUESTION CARDS ── */
#quiz-wrap { padding: 24px 32px 40px; max-width: 860px; margin: 0 auto; }

.q-card {
  background: var(--paper);
  border-radius: 10px;
  box-shadow: var(--shadow);
  margin-bottom: 28px;
  border-left: 4px solid var(--gold);
  overflow: hidden;
  animation: slideUp .35s ease both;
}
@keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }

.q-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 18px 22px 12px;
  border-bottom: 1px solid var(--rule);
}
.q-num {
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--gold);
  white-space: nowrap;
}
.q-text {
  font-size: 1.02rem;
  line-height: 1.65;
  flex: 1;
}

.svg-wrap {
  text-align: center;
  padding: 8px 22px 0;
  overflow-x: auto;
}
svg { max-width: 100%; height: auto; }

/* ── OPTIONS ── */
.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 14px 22px 18px;
}
@media(max-width:560px){ .options{ grid-template-columns:1fr; } }

.opt {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  border: 1.5px solid var(--rule);
  border-radius: 7px;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  font-size: .97rem;
  line-height: 1.5;
  user-select: none;
  background: var(--cream);
}
.opt:hover:not(.locked) { border-color: var(--gold); background: #fef9ec; }
.opt input[type=radio] { display:none; }
.opt-label {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px; height: 26px;
  min-width: 26px;
  border-radius: 50%;
  border: 2px solid var(--rule);
  font-weight: 700;
  font-size: .85rem;
  transition: all .2s;
  background: #fff;
}
.opt.selected .opt-label { background: var(--gold); border-color: var(--gold); color: #fff; }
.opt.correct { background: var(--correct-bg); border-color: var(--correct-bd); }
.opt.correct .opt-label { background: var(--correct-bd); border-color: var(--correct-bd); color: #fff; }
.opt.wrong { background: var(--wrong-bg); border-color: var(--wrong-bd); }
.opt.wrong .opt-label { background: var(--wrong-bd); border-color: var(--wrong-bd); color: #fff; }
.opt.locked { cursor: default; }

/* ── SOLUTION ── */
.solution {
  display: none;
  margin: 0 22px 18px;
  padding: 14px 16px;
  background: #fffbea;
  border-left: 4px solid var(--gold2);
  border-radius: 0 8px 8px 0;
  font-size: .92rem;
  line-height: 1.7;
  color: #3d3000;
}
.solution-title {
  font-weight: 700;
  font-size: .82rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--gold);
  margin-bottom: 6px;
}

/* ── FOOTER ── */
.site-footer {
  text-align: center;
  padding: 20px;
  font-size: .8rem;
  opacity: .5;
  border-top: 1px solid var(--rule);
}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .ctrl-bar { padding: 12px 16px; }
  #quiz-wrap { padding: 16px 12px 40px; }
  .q-head, .options, .solution { padding-left: 14px; padding-right: 14px; }
  .svg-wrap { padding: 8px 14px 0; }
  #result-banner { margin: 16px; }
}
</style>
</head>

<!-- HEADER -->
<header class="site-header">
  <div class="school-name">Cơ sở dạy thêm Trí Đức · THPT Ca Văn Thỉnh</div>
  <div class="teacher-name">Giáo viên: Thầy Đinh Phước Tân</div>
  <h1 class="quiz-title">Trắc Nghiệm Toán 12</h1>

</header>

<!-- CONTROL BAR -->
<div class="ctrl-bar">
  <div class="timer-wrap">
    <div>
      <div class="timer-label">Thời gian</div>
      <div id="timer">45:00</div>

  <div style="margin-top:18px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
    <button class="btn btn-gold" onclick="shuffleAndRestart()">🔀 Thi lại (đề mới)</button>

</div>

<!-- QUESTIONS -->
<main id="quiz-wrap"></main>

<!-- ═══════════════════════════════════════════════════════
     SVG ASSETS – bảng biến thiên & đồ thị
     ═══════════════════════════════════════════════════════ -->
<script>
// ── SVG helpers ──────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k,v] of Object.entries(attrs||{})) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
}

/* SVG 1: Bảng biến thiên – Câu 1
   x: -∞   -8    0    8   +∞
   y': +  0  -  0  +  0  -
   y:  -∞ → -5 ← -7 → -5 → -∞
*/
function svg_bbt1() {
  const W=440, H=100;
  const xs=[0,55,130,205,280,350,420];
  const rows=[18,42,68,95];
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,style:'font-family:serif'});
  // border
  svg.appendChild(el('rect',{x:1,y:1,width:W-2,height:H-2,fill:'none',stroke:'#333',strokeWidth:1.2}));
  // row lines
  [rows[0]+14, rows[1]+14].forEach(y=>{
    svg.appendChild(el('line',{x1:1,y1:y,x2:W-1,y2:y,stroke:'#333',strokeWidth:.8}));
  });
  // col lines
  xs.slice(1,-1).forEach(x=>{
    svg.appendChild(el('line',{x1:x,y1:1,x2:x,y2:H-1,stroke:'#ddd',strokeWidth:.7}));
  });
  svg.appendChild(el('line',{x1:xs[1],y1:1,x2:xs[1],y2:H-1,stroke:'#333',strokeWidth:.8}));

  const txt=(t,x,y,bold,color)=>{
    const n=el('text',{x,y,textAnchor:'middle',dominantBaseline:'middle',
      fontSize:12,fontWeight:bold?'bold':'normal',fill:color||'#111'});
    n.textContent=t; svg.appendChild(n);
  };
  // headers
  txt('x',28,rows[0]+7,true);
  txt("y'",28,rows[1]+7,true);
  txt('y',28,rows[2]+14,true);
  // x-values
  const xvals=['-∞','-8','0','8','+∞'];
  const midX=[(xs[1]+xs[0])/2,(xs[1]+xs[2])/2,(xs[2]+xs[3])/2,(xs[3]+xs[4])/2,(xs[4]+xs[5])/2,(xs[5]+xs[6])/2];
  xvals.forEach((v,i)=>txt(v,xs[i+1],rows[0]+7));
  // y' signs
  const signs=['+','0','-','0','+','0','-'];
  const signX=[(xs[1]+xs[2])/2, xs[2], (xs[2]+xs[3])/2, xs[3], (xs[3]+xs[4])/2, xs[4], (xs[4]+xs[5])/2];
  signs.forEach((s,i)=>txt(s,signX[i],rows[1]+7,false,s==='+' ? '#0a5' : s==='-' ? '#c00' : '#333'));
  // y values & arrows
  const yvals=['-∞','-5','-7','-5','-∞'];
  const yVpos=[rows[2]+22, rows[2]+6, rows[2]+22, rows[2]+6, rows[2]+22];
  const ycols=['#555','#0a5','#c00','#0a5','#555'];
  yvals.forEach((v,i)=>txt(v,xs[i+1],yVpos[i],false,ycols[i]));
  // arrows
  const arrow=(x1,y1,x2,y2)=>{
    svg.appendChild(el('line',{x1,y1,x2,y2,stroke:'#333',strokeWidth:1.2,markerEnd:'url(#arr)'}));
  };
  const defs=el('defs',{}); svg.insertBefore(defs,svg.firstChild);
  const marker=el('marker',{id:'arr',markerWidth:6,markerHeight:6,refX:3,refY:3,orient:'auto'});
  marker.appendChild(el('path',{d:'M0,0 L6,3 L0,6 Z',fill:'#333'}));
  defs.appendChild(marker);
  arrow(xs[1]+8,rows[2]+22-2, xs[2]-8,rows[2]+6+2);   // ↗
  arrow(xs[2]+8,rows[2]+6+2, xs[3]-8,rows[2]+22-2);   // ↘
  arrow(xs[3]+8,rows[2]+22-2, xs[4]-8,rows[2]+6+2);   // ↗
  arrow(xs[4]+8,rows[2]+6+2, xs[5]-8,rows[2]+22-2);   // ↘
  return svg.outerHTML;
}

/* SVG 2: Đồ thị y = (x+1)^3 - 3(x+1)^2 + 1 → cực đại(-1,1), cực tiểu(1,-3) */
function svg_do_thi_2() {
  const W=220, H=200, pad=40;
  const cx=90, cy=110; // pixel origin
  const sx=35, sy=28;  // scale
  const f=x => Math.pow(x+1,3) - 3*Math.pow(x+1,2) + 1;
  const px=x => cx + x*sx;
  const py=y => cy - y*sy;

  let d='';
  for (let xi=-2.8; xi<=2.8; xi+=0.05) {
    const yi=f(xi);
    if (yi < -4.5 || yi > 2.5) continue;
    d += (d==='' ? 'M' : 'L') + `${px(xi).toFixed(2)},${py(yi).toFixed(2)} `;
  }
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,style:'font-family:serif;overflow:visible'});
  const t=(txt,x,y,anc,sz)=>{
    const n=el('text',{x,y,textAnchor:anc||'middle',dominantBaseline:'middle',fontSize:sz||11,fill:'#111'});
    n.textContent=txt; svg.appendChild(n);
  };
  // axes
  svg.appendChild(el('line',{x1:10,y1:cy,x2:W-10,y2:cy,stroke:'#333',strokeWidth:1.2,markerEnd:'url(#arr2)'}));
  svg.appendChild(el('line',{x1:cx,y1:H-10,x2:cx,y2:8,stroke:'#333',strokeWidth:1.2,markerEnd:'url(#arr2)'}));
  const defs=el('defs',{}); svg.insertBefore(defs,svg.firstChild);
  const mk=el('marker',{id:'arr2',markerWidth:6,markerHeight:6,refX:5,refY:3,orient:'auto'});
  mk.appendChild(el('path',{d:'M0,0 L6,3 L0,6 Z',fill:'#333'})); defs.appendChild(mk);
  // curve
  svg.appendChild(el('path',{d,fill:'none',stroke:'#1a5fb4',strokeWidth:2}));
  // ticks & labels
  [[-1,'−1'],[1,'1']].forEach(([x,lbl])=>{
    svg.appendChild(el('line',{x1:px(x),y1:cy-3,x2:px(x),y2:cy+3,stroke:'#333',strokeWidth:1}));
    t(lbl,px(x),cy+12);
  });
  [[1,'1'],[-3,'−3']].forEach(([y,lbl])=>{
    svg.appendChild(el('line',{x1:cx-3,y1:py(y),x2:cx+3,y2:py(y),stroke:'#333',strokeWidth:1}));
    t(lbl,cx-14,py(y));
  });
  // dashed
  const dash={stroke:'#888',strokeWidth:.8,strokeDasharray:'4,3'};
  svg.appendChild(el('line',{x1:px(1),y1:cy,x2:px(1),y2:py(-3),...dash}));
  svg.appendChild(el('line',{x1:cx,y1:py(-3),x2:px(1),y2:py(-3),...dash}));
  svg.appendChild(el('line',{x1:px(-1),y1:cy,x2:px(-1),y2:py(1),...dash}));
  svg.appendChild(el('line',{x1:cx,y1:py(1),x2:px(-1),y2:py(1),...dash}));
  // origin
  t('O',cx-10,cy+12);
  t('x',W-8,cy+12);
  t('y',cx+8,12);
  return svg.outerHTML;
}

/* SVG 3: Bảng xét dấu f'(x)=(x-15)(x-16) */
function svg_bxt3() {
  const W=340, H=70;
  const xs=[0,55,140,230,310];
  const rows=[0,22,44,68];
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,style:'font-family:serif'});
  svg.appendChild(el('rect',{x:1,y:1,width:W-2,height:H-2,fill:'none',stroke:'#333',strokeWidth:1.2}));
  [rows[1]].forEach(y=>{
    svg.appendChild(el('line',{x1:1,y1:y,x2:W-1,y2:y,stroke:'#333',strokeWidth:.8}));
  });
  svg.appendChild(el('line',{x1:xs[1],y1:1,x2:xs[1],y2:H-1,stroke:'#333',strokeWidth:.8}));
  const txt=(t,x,y,bold,color)=>{
    const n=el('text',{x,y,textAnchor:'middle',dominantBaseline:'middle',fontSize:12,fontWeight:bold?'bold':'normal',fill:color||'#111'});
    n.textContent=t; svg.appendChild(n);
  };
  txt('x',28,rows[0]+11,true);
  txt("y'",28,rows[1]+11,true);
  const xvals=['-∞','15','16','+∞'];
  xvals.forEach((v,i)=>txt(v,xs[i+1],rows[0]+11));
  const signs=['+','0','-','0','+'];
  const sX=[(xs[1]+xs[2])/2, xs[2], (xs[2]+xs[3])/2, xs[3], (xs[3]+xs[4])/2];
  signs.forEach((s,i)=>txt(s,sX[i],rows[1]+11,false,s==='+'?'#0a5':s==='-'?'#c00':'#333'));
  return svg.outerHTML;
}

/* SVG 4: Đồ thị hàm số liên tục trên [-8;40] */
function svg_do_thi_4() {
  const W=260, H=200, cx=55, cy=110;
  const sx=24, sy=22; // 1 unit = 24px horizontal, 22px vertical (real: /8 scale)
  // real coords: (-8,-16),(0,8),(16,-16),(24,24),(40,8)
  // map: pixel x = cx + (real/8)*sx, pixel y = cy - (real/8)*sy → nope, use direct pixel map
  const rx=x => cx + (x/8)*sx;
  const ry=y => cy - (y/8)*sy;

  const pts=[[-8,-16],[0,8],[16,-16],[24,24],[40,8]];
  const px=pts.map(([x,y])=>[rx(x),ry(y)]);

  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,style:'font-family:serif;overflow:visible'});
  const defs=el('defs',{}); svg.insertBefore(defs,svg.firstChild);
  const mk=el('marker',{id:'arr4',markerWidth:6,markerHeight:6,refX:5,refY:3,orient:'auto'});
  mk.appendChild(el('path',{d:'M0,0 L6,3 L0,6 Z',fill:'#333'})); defs.appendChild(mk);

  // smooth curve using catmull-rom via bezier approx
  function catmullPath(points) {
    if (points.length < 2) return '';
    let d = `M${points[0][0].toFixed(1)},${points[0][1].toFixed(1)}`;
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[Math.max(0, i-1)];
      const p1 = points[i];
      const p2 = points[i+1];
      const p3 = points[Math.min(points.length-1, i+2)];
      const cp1x = p1[0] + (p2[0] - p0[0]) / 6;
      const cp1y = p1[1] + (p2[1] - p0[1]) / 6;
      const cp2x = p2[0] - (p3[0] - p1[0]) / 6;
      const cp2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += ` C${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d;
  }

  // axes
  svg.appendChild(el('line',{x1:8,y1:cy,x2:W-8,y2:cy,stroke:'#333',strokeWidth:1.2,markerEnd:'url(#arr4)'}));
  svg.appendChild(el('line',{x1:cx,y1:H-6,x2:cx,y2:6,stroke:'#333',strokeWidth:1.2,markerEnd:'url(#arr4)'}));

  // curve
  const curveD = catmullPath(px);
  svg.appendChild(el('path',{d:curveD,fill:'none',stroke:'#1a5fb4',strokeWidth:2}));

  const t=(txt,x,y,anc,sz)=>{
    const n=el('text',{x,y,textAnchor:anc||'middle',dominantBaseline:'middle',fontSize:sz||10,fill:'#111'});
    n.textContent=txt; svg.appendChild(n);
  };
  const dash={stroke:'#888',strokeWidth:.8,strokeDasharray:'4,3'};

  // key points & dashes
  const kp=pts.map(([x,y])=>({x,y,px:rx(x),py:ry(y)}));
  // (-8,-16)
  svg.appendChild(el('line',{x1:kp[0].px,y1:cy,x2:kp[0].px,y2:kp[0].py,...dash}));
  svg.appendChild(el('line',{x1:cx,y1:kp[0].py,x2:kp[0].px,y2:kp[0].py,...dash}));
  // (16,-16) same y
  svg.appendChild(el('line',{x1:kp[2].px,y1:cy,x2:kp[2].px,y2:kp[2].py,...dash}));
  // (24,24)
  svg.appendChild(el('line',{x1:kp[3].px,y1:cy,x2:kp[3].px,y2:kp[3].py,...dash}));
  svg.appendChild(el('line',{x1:cx,y1:kp[3].py,x2:kp[3].px,y2:kp[3].py,...dash}));
  // (40,8)
  svg.appendChild(el('line',{x1:kp[4].px,y1:cy,x2:kp[4].px,y2:kp[4].py,...dash}));
  svg.appendChild(el('line',{x1:cx,y1:kp[4].py,x2:kp[4].px,y2:kp[4].py,...dash}));

  // labels on axes
  t('−8',kp[0].px,cy+13); t('16',kp[2].px,cy+13); t('24',kp[3].px,cy+13); t('40',kp[4].px,cy+13);
  t('−16',cx-18,kp[0].py); t('8',cx-12,kp[4].py); t('24',cx-14,kp[3].py);
  t('O',cx-10,cy+11); t('x',W-6,cy+11); t('y',cx+8,9);
  return svg.outerHTML;
}

/* SVG 9: Đồ thị y = x³ - 3x² + 2, cực đại(0,2), cực tiểu(2,-2) */
function svg_do_thi_9() {
  const W=220, H=200;
  const cx=60, cy=110, sx=36, sy=32;
  const f=x => x*x*x - 3*x*x + 2;
  const px=x => cx + x*sx;
  const py=y => cy - y*sy;

  let d='';
  for (let xi=-1.2; xi<=3.0; xi+=0.04) {
    const yi=f(xi);
    if (yi < -3.5 || yi > 3.5) continue;
    d += (d==='' ? 'M' : 'L') + `${px(xi).toFixed(2)},${py(yi).toFixed(2)} `;
  }
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,style:'font-family:serif;overflow:visible'});
  const defs=el('defs',{}); svg.insertBefore(defs,svg.firstChild);
  const mk=el('marker',{id:'arr9',markerWidth:6,markerHeight:6,refX:5,refY:3,orient:'auto'});
  mk.appendChild(el('path',{d:'M0,0 L6,3 L0,6 Z',fill:'#333'})); defs.appendChild(mk);
  svg.appendChild(el('line',{x1:8,y1:cy,x2:W-8,y2:cy,stroke:'#333',strokeWidth:1.2,markerEnd:'url(#arr9)'}));
  svg.appendChild(el('line',{x1:cx,y1:H-6,x2:cx,y2:6,stroke:'#333',strokeWidth:1.2,markerEnd:'url(#arr9)'}));
  svg.appendChild(el('path',{d,fill:'none',stroke:'#1a5fb4',strokeWidth:2}));

  const t=(txt,x,y,anc)=>{
    const n=el('text',{x,y,textAnchor:anc||'middle',dominantBaseline:'middle',fontSize:11,fill:'#111'});
    n.textContent=txt; svg.appendChild(n);
  };
  const dash={stroke:'#888',strokeWidth:.8,strokeDasharray:'4,3'};
  // ticks
  svg.appendChild(el('line',{x1:px(2),y1:cy-3,x2:px(2),y2:cy+3,stroke:'#333',strokeWidth:1}));
  t('2',px(2),cy+12);
  [2,-2].forEach(y=>{
    svg.appendChild(el('line',{x1:cx-3,y1:py(y),x2:cx+3,y2:py(y),stroke:'#333',strokeWidth:1}));
    t(y===2?'2':'−2',cx-16,py(y));
  });
  // dashes
  svg.appendChild(el('line',{x1:px(2),y1:cy,x2:px(2),y2:py(-2),...dash}));
  svg.appendChild(el('line',{x1:cx,y1:py(-2),x2:px(2),y2:py(-2),...dash}));
  svg.appendChild(el('line',{x1:cx,y1:py(2),x2:px(0),y2:py(2),...dash}));
  t('O',cx-10,cy+12); t('x',W-8,cy+12); t('y',cx+8,10);
  return svg.outerHTML;
}

// ── STATE ──────────────────────────────────────────────────
let questions = [];
let answered  = new Array(15).fill(false);
let userAns   = new Array(15).fill(-1);
let submitted = false;
let timeLeft  = 45 * 60;
let timerID   = null;

// ── SHUFFLE ────────────────────────────────────────────────
function shuffle(arr) {
  const a=[...arr];
  for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

// ── RENDER ─────────────────────────────────────────────────
const SVG_MAP = {
  bbt1: svg_bbt1,
  dt2:  svg_do_thi_2,
  bxt3: svg_bxt3,
  dt4:  svg_do_thi_4,
  dt9:  svg_do_thi_9
};

function injectSVGs(root) {
  root.querySelectorAll('[data-svg]').forEach(div=>{
    const key=div.dataset.svg;
    if (SVG_MAP[key]) div.innerHTML = SVG_MAP[key]();
  });
}

function renderQuiz() {
  const wrap = document.getElementById('quiz-wrap');
  wrap.innerHTML = '';
  const labels = ['A','B','C','D'];

  questions.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.style.animationDelay = `${qi*0.05}s`;

    // shuffle options & track correct
    const idxs = shuffle([0,1,2,3]);
    const newCorrect = idxs.indexOf(q.ans);
    card.dataset.correct = newCorrect;

    let optsHTML = '';
    idxs.forEach((origIdx, newIdx) => {
      optsHTML += `
        <label class="opt" id="opt-${qi}-${newIdx}" onclick="selectOpt(${qi},${newIdx},this)">
          <input type="radio" name="q${qi}" value="${newIdx}">
          <span class="opt-label">${labels[newIdx]}</span>
          <span class="opt-text">${q.opts[origIdx]}</span>
        </label>`;
    });

    card.innerHTML = `
      <div class="q-head">
        <span class="q-num">Câu ${qi+1}</span>
        <div class="q-text">${q.q}</div>
      </div>
      <div class="options">${optsHTML}</div>
      <div class="solution" id="sol-${qi}">
        <div class="solution-title">📘 Lời giải</div>
        ${q.exp}
      </div>`;

    wrap.appendChild(card);
    injectSVGs(card);
  });

  updateProgress();
  if (window.MathJax) MathJax.typesetPromise([wrap]);
}

function selectOpt(qi, optIdx, labelEl) {
  if (submitted) return;
  if (answered[qi]) return; // once locked per question? No – allow change
  const card = labelEl.closest('.q-card');
  card.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
  labelEl.classList.add('selected');
  userAns[qi] = optIdx;
  if (!answered[qi]) { answered[qi]=true; }
  updateProgress();
}

function updateProgress() {
  const n = answered.filter(Boolean).length;
  const total = questions.length;
  document.getElementById('prog-label').textContent = `Câu ${n} / ${total} đã trả lời`;
  document.getElementById('prog-fill').style.width = `${(n/total)*100}%`;
}

// ── TIMER ──────────────────────────────────────────────────
function startTimer() {
  clearInterval(timerID);
  timeLeft = 45*60;
  timerID = setInterval(()=>{
    timeLeft--;
    const m=Math.floor(timeLeft/60), s=timeLeft%60;
    const el=document.getElementById('timer');
    el.textContent = `${m}:${s<10?'0':''}${s}`;
    if (timeLeft<=300) el.classList.add('warning');
    if (timeLeft<=0) { clearInterval(timerID); submitQuiz(); }
  },1000);
}

// ── SUBMIT ─────────────────────────────────────────────────
function submitQuiz() {
  if (submitted) return;
  submitted = true;
  clearInterval(timerID);

  let score = 0;
  questions.forEach((q, qi) => {
    const correctIdx = parseInt(document.querySelector(`.q-card:nth-child(${qi+1})`).dataset.correct);
    const ua = userAns[qi];
    // mark correct option
    document.getElementById(`opt-${qi}-${correctIdx}`).classList.add('correct','locked');
    if (ua !== -1 && ua !== correctIdx) {
      document.getElementById(`opt-${qi}-${ua}`).classList.add('wrong','locked');
    }
    // lock all
    document.querySelectorAll(`.q-card:nth-child(${qi+1}) .opt`).forEach(o=>o.classList.add('locked'));
    // show solution
    document.getElementById(`sol-${qi}`).style.display='block';
    if (ua===correctIdx) score++;
  });

  // result
  const total = questions.length;
  const diem  = (score/total*10).toFixed(1);
  const ring  = document.getElementById('score-ring');
  ring.textContent = diem;
  ring.style.borderColor = score>=total*0.8 ? 'var(--teal)' : score>=total*0.5 ? 'var(--gold)' : 'var(--rust)';
  ring.style.color = ring.style.borderColor;
  document.getElementById('score-detail').innerHTML =
    `Số câu đúng: <b>${score}/${total}</b> &nbsp;|&nbsp; Điểm: <b>${diem}/10</b>`;
  const banner=document.getElementById('result-banner');
  banner.style.display='block';
  banner.scrollIntoView({behavior:'smooth',block:'start'});

  const btn=document.getElementById('submit-btn');
  btn.disabled=true; btn.textContent='Đã nộp bài';

  if (window.MathJax) MathJax.typesetPromise();
}

// ── RESTART ────────────────────────────────────────────────
function reset() {
  submitted=false;
  answered=new Array(15).fill(false);
  userAns=new Array(15).fill(-1);
  document.getElementById('result-banner').style.display='none';
  const btn=document.getElementById('submit-btn');
  btn.disabled=false; btn.textContent='Nộp bài & Chấm điểm';
  document.getElementById('timer').classList.remove('warning');
  startTimer();
}

function shuffleAndRestart() {
  questions = shuffle(ALL_QUESTIONS);
  reset();
  renderQuiz();
  window.scrollTo({top:0,behavior:'smooth'});
}

function restartSame() {
  reset();
  renderQuiz();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ── INIT ───────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', ()=>{
  questions = shuffle(ALL_QUESTIONS);
  renderQuiz();
  startTimer();
});
</script>
