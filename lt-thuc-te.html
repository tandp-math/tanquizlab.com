    // --- 2. CÁC HÀM TIỆN ÍCH ---
    function shuffleArray(array) {
        let curId = array.length;
        while (0 !== curId) {
            let randId = Math.floor(Math.random() * curId);
            curId -= 1;
            let tmp = array[curId];
            array[curId] = array[randId];
            array[randId] = tmp;
        }
        return array;
    }

    function generateExamCode() {
        return Math.floor(100 + Math.random() * 900); // 3 số ngẫu nhiên
    }

    const GOOGLE_SCRIPT_URL = "YOUR_GOOGLE_SCRIPT_URL_HERE"; 
    
    let questions = [];
    let isSubmitted = false;
    let startTime = Date.now();

    // --- 3. KHỞI TẠO ĐỀ THI ---
    function initExam() {
        document.getElementById('examCode').innerText = generateExamCode();

        // Trộn câu hỏi và đáp án
        questions = rawQuestions.map((q, qIndex) => {
            let optionsObj = q.options.map((opt, oIndex) => ({ text: opt, isCorrect: oIndex === q.correct }));
            optionsObj = shuffleArray(optionsObj);
            return {
                id: qIndex,
                text: q.text,
                options: optionsObj,
                explanation: q.explanation
            };
        });
        questions = shuffleArray(questions);

        renderQuestions();
        
        // Khôi phục bài làm
        const savedData = JSON.parse(localStorage.getItem('savedExamDataReal'));
        if (savedData && !savedData.isSubmitted) {
            document.getElementById('studentName').value = savedData.studentName || '';
            document.getElementById('className').value = savedData.className || '';
            startTime = savedData.startTime || Date.now();
            
            savedData.answers.forEach(ans => {
                const radio = document.querySelector(`input[name="q_${ans.qId}"][value="${ans.optIndex}"]`);
                if(radio) radio.checked = true;
            });
            document.getElementById('restoreAlert').style.display = 'block';
            setTimeout(() => document.getElementById('restoreAlert').style.display = 'none', 3000);
        } else if (savedData && savedData.isSubmitted) {
            document.getElementById('studentName').value = savedData.studentName || '';
            document.getElementById('className').value = savedData.className || '';
            
            savedData.answers.forEach(ans => {
                const radio = document.querySelector(`input[name="q_${ans.qId}"][value="${ans.optIndex}"]`);
                if(radio) radio.checked = true;
            });
            processSubmission(true, savedData.timeTakenStr); 
            return;
        }

        setInterval(autoSave, 10000); 
        
        if(window.MathJax) {
            MathJax.typesetPromise();
        }
    }

    // --- 4. HIỂN THỊ CÂU HỎI ---
    function renderQuestions() {
        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';
        
        questions.forEach((q, index) => {
            let optionsHtml = '';
            const labels = ['A', 'B', 'C', 'D'];
            
            q.options.forEach((opt, optIndex) => {
                optionsHtml += `
                    <div class="form-check mb-2">
                        <input class="form-check-input d-none" type="radio" name="q_${q.id}" id="q_${q.id}_opt_${optIndex}" value="${optIndex}" onchange="autoSave()">
                        <label class="option-label" for="q_${q.id}_opt_${optIndex}" id="label_q_${q.id}_opt_${optIndex}">
                            <strong>${labels[optIndex]}.</strong> ${opt.text}
                        </label>
                    </div>
                `;
            });

            const html = `
                <div class="question-card" id="card_${q.id}">
                    <div class="question-text">Câu ${index + 1}: ${q.text}</div>
                    <div class="options-group">
                        ${optionsHtml}
                    </div>
                    <div class="explanation-box" id="exp_${q.id}">
                        <strong>Giải thích:</strong> ${q.explanation}
                    </div>
                </div>
            `;
            container.innerHTML += html;
        });
    }

    // --- 5. LƯU TỰ ĐỘNG ---
    function autoSave() {
        if(isSubmitted) return;
        const studentName = document.getElementById('studentName').value;
        const className = document.getElementById('className').value;
        let answers = [];
        
        questions.forEach(q => {
            const selected = document.querySelector(`input[name="q_${q.id}"]:checked`);
            if (selected) {
                answers.push({ qId: q.id, optIndex: selected.value });
            }
        });

        const data = {
            studentName, className, startTime, answers, isSubmitted: false
        };
        localStorage.setItem('savedExamDataReal', JSON.stringify(data));
        
        const toast = document.getElementById('saveToast');
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 2000);
    }

    // --- 6. XỬ LÝ NỘP BÀI ---
    document.getElementById('btnSubmit').addEventListener('click', () => {
        let answeredCount = 0;
        questions.forEach(q => {
            if(document.querySelector(`input[name="q_${q.id}"]:checked`)) answeredCount++;
        });

        if (answeredCount < questions.length / 2) {
            alert("Bạn phải làm ít nhất 50% số câu hỏi mới được nộp bài!");
            return;
        }

        if(confirm("Bạn có chắc chắn muốn nộp bài?")) {
            processSubmission();
        }
    });

    function processSubmission(isRestoring = false, savedTimeStr = "") {
        isSubmitted = true;
        document.getElementById('btnSubmit').style.display = 'none';
        
        let correctCount = 0;
        let answersData = [];

        questions.forEach(q => {
            const selected = document.querySelector(`input[name="q_${q.id}"]:checked`);
            const selectedVal = selected ? parseInt(selected.value) : -1;
            answersData.push({ qId: q.id, optIndex: selectedVal });

            q.options.forEach((opt, optIndex) => {
                const label = document.getElementById(`label_q_${q.id}_opt_${optIndex}`);
                const radio = document.getElementById(`q_${q.id}_opt_${optIndex}`);
                radio.disabled = true; 
                
                if (opt.isCorrect) {
                    label.classList.add('correct-answer');
                } else if (selectedVal === optIndex && !opt.isCorrect) {
                    label.classList.add('wrong-answer');
                }
            });

            if (selectedVal !== -1 && q.options[selectedVal].isCorrect) {
                correctCount++;
            }

            document.getElementById(`exp_${q.id}`).style.display = 'block';
        });

        const totalQuestions = questions.length;
        const score = (correctCount / totalQuestions) * 10;
        const percent = Math.round((correctCount / totalQuestions) * 100);
        
        let timeString = savedTimeStr;
        let durationMinutes = 0;
        
        if (!isRestoring) {
            const timeTakenSec = Math.floor((Date.now() - startTime) / 1000);
            durationMinutes = (timeTakenSec / 60).toFixed(1);
            let m = Math.floor(timeTakenSec / 60);
            let s = timeTakenSec % 60;
            timeString = (m < 10 ? "0" + m : m) + " phút " + (s < 10 ? "0" + s : s) + " giây";
        }

        document.getElementById('results-section').style.display = 'block';
        document.getElementById('scoreDisplay').innerText = score.toFixed(2) + "/10";
        document.getElementById('correctCountDisplay').innerText = correctCount + "/" + totalQuestions;
        document.getElementById('percentDisplay').innerText = percent + "%";
        document.getElementById('timeTakenDisplay').innerText = timeString;

        const studentName = document.getElementById('studentName').value || "Chưa nhập";
        const className = document.getElementById('className').value || "Chưa nhập";

        localStorage.setItem('savedExamDataReal', JSON.stringify({
            studentName, className, answers: answersData, isSubmitted: true, timeTakenStr: timeString
        }));

        if(!isRestoring && GOOGLE_SCRIPT_URL !== "YOUR_GOOGLE_SCRIPT_URL_HERE") {
            sendToGoogleSheets({
                student_name: studentName,
                class_name: className,
                part1_score: score.toFixed(2),
                part2_score: 0,
                part3_score: 0,
                total_score: score.toFixed(2),
                submit_time: new Date().toLocaleString('vi-VN'),
                duration_minutes: durationMinutes,
                percent: percent + "%"
            });
        }
    }

    // --- 7. GỬI GOOGLE SHEETS ---
    function sendToGoogleSheets(data) {
        const formData = new FormData();
        for (const key in data) {
            formData.append(key, data[key]);
        }

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            body: formData,
            mode: 'no-cors'
        }).then(() => {
            console.log("Đã gửi dữ liệu về Google Sheets.");
        }).catch(err => console.error("Lỗi gửi dữ liệu:", err));
    }

    window.onload = initExam;
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
